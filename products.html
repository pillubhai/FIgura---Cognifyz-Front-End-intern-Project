<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIGURA — Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Page Loader -->
  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3>Your Cart</h3>
      <button class="cart-close" id="cartClose">×</button>
    </div>
    <div class="cart-items" id="cartItems"><p class="cart-empty">Your cart is empty.</p></div>
    <div class="cart-drawer-footer">
      <div class="cart-total">Total: <strong id="cartTotal">$0.00</strong></div>
      <button class="hero-cta w-100 justify-content-center mt-3">Checkout</button>
    </div>
  </div>

  <!-- Scroll To Top -->
  <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">↑</button>

  <nav class="fig-nav" id="mainNav">
    <a href="index.html" class="fig-logo">Figura</a>
    <ul class="fig-nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="products.html" class="active">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="fig-nav-actions">
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="e.g. jacket, ring..." />
        <button class="search-icon" id="searchToggle">🔍</button>
      </div>
      <button class="fig-cart-btn" id="cartBtn" aria-label="Cart">🛍
        <span class="fig-cart-count" id="cartCount">0</span>
      </button>
      <a href="login.html" class="auth-link">Login</a>
      <a href="signup.html" class="auth-link">Sign Up</a>
      <button class="nav-hamburger" id="hamburger" aria-label="Menu">☰</button>
    </div>
  </nav>

  <main class="shop-layout" style="padding-top:90px;">

    <!-- Sidebar -->
    <aside class="shop-sidebar">
      <h3 class="sidebar-title">Categories</h3>
      <ul class="sidebar-menu">
        <li><button class="sidebar-btn active" data-cat="all">All Products</button></li>
        <li><button class="sidebar-btn" data-cat="men's clothing">Men's Clothing</button></li>
        <li><button class="sidebar-btn" data-cat="women's clothing">Women's Clothing</button></li>
        <li><button class="sidebar-btn" data-cat="jewelery">Jewelery</button></li>
        <li><button class="sidebar-btn" data-cat="electronics">Electronics</button></li>
      </ul>

      <h3 class="sidebar-title mt-4">Sort By</h3>
      <ul class="sidebar-menu">
        <li><button class="sidebar-btn active-sort" data-sort="default">Default</button></li>
        <li><button class="sidebar-btn" data-sort="low">Price: Low to High</button></li>
        <li><button class="sidebar-btn" data-sort="high">Price: High to Low</button></li>
        <li><button class="sidebar-btn" data-sort="rating">Top Rated</button></li>
      </ul>
    </aside>

    <!-- Products Area -->
    <div class="shop-content">
      <div class="section-header mb-4">
        <h1 class="section-title" id="shopHeading">All Products</h1>
        <p id="apiStatus" class="text-muted small mb-0"></p>
      </div>
      <div class="product-grid" id="apiProductGrid"></div>
    </div>

  </main>

  <footer class="fig-footer mt-5">
    <div class="container d-flex flex-wrap justify-content-between align-items-center py-4">
      <span class="fig-logo" style="font-size:18px;">Figura</span>
      <p class="mb-0 text-muted small">© 2025 Figura. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

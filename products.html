<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="my-4">Shop</h1>
        <div class="row">
            <div class="col-md-3">
                <h4>Filters</h4>
                <form>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select class="form-control" id="category">
                            <option>All</option>
                            <option>Category 1</option>
                            <option>Category 2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="price-range">Price Range</label>
                        <input type="range" class="form-control" id="price-range" min="0" max="1000">
                    </div>
                    <button type="submit" class="btn btn-primary">Apply Filters</button>
                </form>
            </div>
            <div class="col-md-9">
                <h4 class="my-4">Products</h4>
                <div class="form-group">
                    <label for="sort">Sort By</label>
                    <select class="form-control" id="sort">
                        <option value="default">Default</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                    </select>
                </div>
                <div class="row" id="product-grid">
                    <!-- Products will be dynamically loaded here from the API -->
                </div>
            </div>
        </div>
    </div>
    <script>
        async function fetchProducts() {
            const response = await fetch('https://api.example.com/products'); // Replace with the actual API endpoint
            const products = await response.json();
            const productGrid = document.getElementById('product-grid');
            products.forEach(product => {
                const productCard = `<div class='col-md-4'>
                    <div class='card mb-4'>
                        <img class='card-img-top' src='${product.image}' alt='${product.name}'>
                        <div class='card-body'>
                            <h5 class='card-title'>${product.name}</h5>
                            <p class='card-text'>Price: $${product.price}</p>
                            <a href='#' class='btn btn-primary'>View Details</a>
                        </div>
                    </div>
                </div>`;
                productGrid.innerHTML += productCard;
            });
        }

        fetchProducts();
    </script>
</body>
</html>

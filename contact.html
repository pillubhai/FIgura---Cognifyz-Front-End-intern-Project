<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIGURA — Contact</title>
  <!-- Task 6: Contact form with JS validation -->
  <!-- Task 7: Bootstrap form layout -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Page Loader -->
  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3>Your Cart</h3>
      <button class="cart-close" id="cartClose">×</button>
    </div>
    <div class="cart-items" id="cartItems"><p class="cart-empty">Your cart is empty.</p></div>
    <div class="cart-drawer-footer">
      <div class="cart-total">Total: <strong id="cartTotal">$0.00</strong></div>
      <button class="hero-cta w-100 justify-content-center mt-3">Checkout</button>
    </div>
  </div>

  <!-- Scroll To Top -->
  <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">↑</button>

  <nav class="fig-nav" id="mainNav">
    <a href="index.html" class="fig-logo">Figura</a>
    <ul class="fig-nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="products.html">Shop</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <div class="fig-nav-actions">
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="e.g. jacket, ring..." />
        <button class="search-icon" id="searchToggle">🔍</button>
      </div>
      <button class="fig-cart-btn" id="cartBtn" aria-label="Cart">🛍
        <span class="fig-cart-count" id="cartCount">0</span>
      </button>
      <a href="login.html" class="auth-link">Login</a>
      <a href="signup.html" class="auth-link">Sign Up</a>
      <button class="nav-hamburger" id="hamburger" aria-label="Menu">☰</button>
    </div>
  </nav>

  <main class="container" style="padding-top:120px; max-width:600px; min-height:80vh;">
    <h1 class="section-title mb-2">Get In Touch</h1>
    <p class="text-muted small mb-4">We'd love to hear from you. Fill in the form below.</p>

    <!-- Task 6: Form with validation -->
    <form id="contactForm" novalidate>
      <div class="mb-3">
        <label for="fname" class="form-label fig-label">Full Name</label>
        <input type="text" id="fname" class="fig-input form-control" placeholder="Jane Doe" />
        <div class="fig-error" id="fnameErr"></div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label fig-label">Email Address</label>
        <input type="email" id="email" class="fig-input form-control" placeholder="jane@example.com" />
        <div class="fig-error" id="emailErr"></div>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label fig-label">Phone <span class="text-muted">(optional)</span></label>
        <input type="tel" id="phone" class="fig-input form-control" placeholder="+1 234 567 8900" />
        <div class="fig-error" id="phoneErr"></div>
      </div>
      <div class="mb-3">
        <label for="subject" class="form-label fig-label">Subject</label>
        <select id="subject" class="fig-input form-select">
          <option value="">Select a subject</option>
          <option>Order Enquiry</option>
          <option>Returns & Exchanges</option>
          <option>Styling Advice</option>
          <option>Other</option>
        </select>
        <div class="fig-error" id="subjectErr"></div>
      </div>
      <div class="mb-4">
        <label for="message" class="form-label fig-label">Message</label>
        <textarea id="message" class="fig-input form-control" rows="4" placeholder="Your message..."></textarea>
        <div class="fig-error" id="messageErr"></div>
      </div>
      <button type="submit" class="hero-cta w-100 justify-content-center">Send Message</button>
      <div id="formSuccess" class="fig-success mt-3" style="display:none;">
        ✓ Message sent! We'll get back to you within 24 hours.
      </div>
    </form>
  </main>

  <footer class="fig-footer mt-5">
    <div class="container d-flex flex-wrap justify-content-between align-items-center py-4">
      <span class="fig-logo" style="font-size:18px;">Figura</span>
      <p class="mb-0 text-muted small">© 2025 Figura. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

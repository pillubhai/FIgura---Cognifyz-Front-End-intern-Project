<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figura - Cognifyz Front End Intern Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="logo">Figura</div>
        <ul>
            <li><a href="#collections">Collections</a></li>
            <li><a href="#new-arrivals">New Arrivals</a></li>
            <li><a href="#featured">Featured</a></li>
            <li><a href="#cart">Cart</a></li>
            <li><a href="#theme-switcher">Theme Switcher</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <h1>Welcome to Figura</h1>
        <p>Your one-stop shop for the best pieces!</p>
        <a href="#collections" class="cta-button">Shop Now</a>
    </header>

    <!-- Collections Section -->
    <section id="collections">
        <h2>Collections</h2>
        <div class="collection-list">
            <!-- Collection items go here -->
        </div>
    </section>

    <!-- New Arrivals Section -->
    <section id="new-arrivals">
        <h2>New Arrivals</h2>
        <div class="new-arrivals-list">
            <!-- New arrival items go here -->
        </div>
    </section>

    <!-- Featured Pieces Section -->
    <section id="featured">
        <h2>Featured Pieces</h2>
        <div class="featured-list">
            <!-- Featured pieces go here -->
        </div>
    </section>

    <!-- Cart Drawer -->
    <div id="cart" class="cart-drawer">
        <h2>Your Cart</h2>
        <div class="cart-items">
            <!-- Cart items go here -->
        </div>
        <button class="checkout-btn">Checkout</button>
    </div>

    <!-- Theme Switcher -->
    <div id="theme-switcher">
        <h2>Switch Theme</h2>
        <button id="light-theme">Light</button>
        <button id="dark-theme">Dark</button>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Figura. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
